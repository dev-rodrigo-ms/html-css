<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse; /*PARA JUNTAR AS BORDAS DAS CÉLULAS DA TABELA */
            border: 2px solid red;
            
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            vertical-align: middle; /* "vertical-align" = alinha a celula verticalmente, ex: top, middle e bottom */
            
        }

        tr{
            background-color: #cecfce;
        }
        
    </style>
</head>
<body>
    <h1>Minha primeira Tabela</h1>

    <!-- 
    HIERARQUIA DE ELEMENTOS DE TABELA
     
         TABLE = TABELA
      TABLE ROW= TR > LINHA DA TABELA
       TABLE HEADER = TH > CABEÇALHO DA TABELA
        TABLE DATA = TD > DADOS DA TABELA
     -->
    <table>
        <tr class="linha1">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha2">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="linha3">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr class="linha4">
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
