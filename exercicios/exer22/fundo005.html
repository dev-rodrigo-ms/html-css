<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #container{
            position: relative;
            padding: 10px;
            height: 96vh;
            background-color: purple;
        }
        #conteudo{
            
            position: absolute; /* Para poder usar "left, top" */
            background-color: yellow;
            height: 200px;
            width: 400px;
            left: 50%;
            top: 50%;

            transform: translate(-50px, -50px);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
